name: quran_prima
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  shared_preferences: ^2.2.2
  http: ^1.1.0
  path_provider: ^2.1.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: 12.0.1

  # ── Notifikasi sholat ──────────────────────────
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # ── Preview audio di Settings ──────────────────
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Quran12
      fonts:
        - asset: assets/fonts/LPMQ IsepMisbah.ttf

  assets:
    - assets/images/
    - assets/data/
    - assets/audio/
    - assets/data/surah/

    # ── Audio adzan (untuk preview di app) ─────────
